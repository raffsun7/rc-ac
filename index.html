<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Assignment Cover Page Generator</title>
    <link rel="icon" type="image/x-icon" href="Rajshahi_College_Logo.svg">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,300&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --accent-color: #C59B27;
            --accent-hover: #A8821C;
            --accent-glow: rgba(197, 155, 39, 0.2);
            --bg-cream: #F5F2EB;
            --panel-bg: #FAF8F5;
            --panel-border: #E6E0D2;
            --input-bg: #FFFFFF;
            --text-main: #2C2825;
            --text-muted: #7A7369;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Form Panel (Left) */
        .form-container {
            width: 420px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            padding: 28px 24px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.04);
            overflow-y: auto;
            z-index: 10;
        }

        .form-container::-webkit-scrollbar {
            width: 6px;
        }
        .form-container::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-title h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-color);
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--panel-border);
        }

        /* Theme Selector */
        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-theme {
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .btn-theme:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .btn-theme.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* Inputs */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Action Buttons */
        .btn-download {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .footer-credit {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        .footer-credit a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* Preview Area (Right) */
        .preview-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #EDE8DF;
        }

        /* Floating Controls */
        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(250, 248, 245, 0.9);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--input-bg);
            color: var(--text-main);
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid var(--panel-border);
        }

        .zoom-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .zoom-level {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 48px;
            text-align: center;
            user-select: none;
        }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            padding: 60px 20px;
        }

        .page-scaler {
            transform-origin: top center;
            transition: transform 0.15s ease-out;
            display: flex;
            justify-content: center;
        }

        /* Hard Locked Engine Canvas */
        .a4-page {
            width: 794px;
            height: 1123px;
            min-width: 794px;
            min-height: 1123px;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Cover Page Themes */
        .theme-classic { padding: 80px; align-items: center; }
        .theme-classic::after { content: ''; position: absolute; top: 40px; left: 40px; right: 40px; bottom: 40px; border: 1px solid #000; pointer-events: none; }
        .theme-classic .college-header { text-align: center; width: 100%; margin-top: 30px; }
        .theme-classic .institution-name { font-size: 34px; font-weight: bold; color: #000; letter-spacing: 0.5px; margin-bottom: 5px; }
        .theme-classic .logo-placeholder { width: 140px; height: 140px; margin-bottom: 25px; object-fit: contain; }
        .theme-classic .department-name { font-size: 22px; font-weight: bold; color: #000; }
        .theme-classic .assignment-info { text-align: center; width: 100%; margin-top: 50px; margin-bottom: auto; }
        .theme-classic .subject-field { font-size: 26px; font-weight: bold; margin-bottom: 15px; color: #000; }
        .theme-classic .title-field { font-size: 20px; font-style: italic; line-height: 1.5; color: #111; max-width: 90%; margin: 0 auto; }
        .theme-classic .meta-container { display: flex; justify-content: space-between; width: 100%; margin-bottom: 150px; align-items: flex-start; }
        .theme-classic .meta-box { width: 45%; border: #000 1.5px dashed; padding: 20px; box-sizing: border-box; }
        .theme-classic .meta-box h3 { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #000; border-bottom: 1px dotted #000000; padding-bottom: 5px; }
        .theme-classic .meta-box p { font-size: 20px !important; line-height: 1.8; color: #000; margin-bottom: 4px; }
        .theme-classic .info-row { display: flex; margin-bottom: 4px; }
        .theme-classic .info-row span { font-size: 20px; color: #000; margin-bottom: 4px; }
        .theme-classic .info-label { width: 80px; }
        .theme-classic .info-val { flex: 1; }
        .theme-classic .submission-date { font-size: 17px; font-weight: bold; color: #000; text-align: center; width: 100%; margin-bottom: 20px; }

        .theme-standard { font-family: 'Inter', sans-serif; padding: 60px; align-items: center; }
        .theme-standard::after { content: ''; position: absolute; top: 30px; left: 30px; right: 30px; bottom: 30px; border: 2px solid #1e3a8a; outline: 1px solid #1e3a8a; outline-offset: 4px; pointer-events: none; }
        .theme-standard .college-header { text-align: center; width: 100%; margin-top: 20px; }
        .theme-standard .institution-name { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 700; color: #0f172a; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }
        .theme-standard .logo-placeholder { width: 130px; height: 130px; margin-bottom: 20px; object-fit: contain; }
        .theme-standard .department-name { font-size: 22px; font-weight: 600; color: #1e3a8a; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; display: inline-block; padding-bottom: 6px; }
        .theme-standard .assignment-info { text-align: center; width: 100%; margin-top: 30px; margin-bottom: auto; padding: 0 20px; }
        .theme-standard .subject-field { font-size: 24px; font-weight: 600; margin-bottom: 18px; color: #334155; }
        .theme-standard .title-container { margin: 20px auto; padding: 24px 30px; background-color: #f8fafc; border-top: 2px solid #1e3a8a; border-bottom: 2px solid #1e3a8a; max-width: 90%; }
        .theme-standard .title-label { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #2563eb; margin-bottom: 8px; display: block; }
        .theme-standard .title-field { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; line-height: 1.4; color: #0f172a; }
        .theme-standard .meta-container { display: flex; justify-content: space-between; width: 100%; margin-bottom: 50px; gap: 24px; }
        .theme-standard .meta-box { border-radius: 8px; width: 48%; background: #fafafa; border: 1px solid #cbd5e1; border-top: 4px solid #1e3a8a; padding: 22px; box-sizing: border-box; }
        .theme-standard .meta-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #1e3a8a; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
        .theme-standard .meta-box p { font-size: 18px; line-height: 1.6; color: #334155; margin-bottom: 6px; }
        .theme-standard .info-row { display: flex; margin-bottom: 6px; font-size: 18px; }
        .theme-standard .info-row span { font-size: 18px; color: #334155; }
        .theme-standard .info-label { width: 90px; font-weight: 600; color: #64748b; }
        .theme-standard .info-val { flex: 1; font-weight: 500; }
        .theme-standard .submission-date { font-size: 16px; font-weight: 600; color: #475569; text-align: center; width: 100%; margin-bottom: 20px; letter-spacing: 0.5px; }

        .theme-royal { font-family: 'Plus Jakarta Sans', sans-serif; background: #fffdfa; padding: 60px; align-items: center; }
        .theme-royal::before { content: ''; position: absolute; top: 35px; left: 35px; right: 35px; bottom: 35px; border: 2px solid #1e293b; pointer-events: none; }
        .theme-royal::after { content: ''; position: absolute; top: 41px; left: 41px; right: 41px; bottom: 41px; border: 1px solid #b45309; pointer-events: none; }
        .theme-royal .college-header { text-align: center; width: 100%; margin-top: 20px; }
        .theme-royal .institution-name { font-family: 'Cinzel', serif; font-size: 34px; font-weight: 700; color: #1e293b; letter-spacing: 2px; margin-bottom: 18px; text-transform: uppercase; }
        .theme-royal .logo-placeholder { width: 120px; height: 120px; object-fit: contain; margin-bottom: 18px; }
        .theme-royal .department-name { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600; color: #b45309; text-transform: uppercase; letter-spacing: 2px; }
        .theme-royal .header-divider { width: 120px; height: 2px; background: linear-gradient(to right, transparent, #b45309, transparent); margin: 15px auto 0; }
        .theme-royal .assignment-info { text-align: center; width: 100%; margin-top: 30px; margin-bottom: auto; padding: 0 40px; }
        .theme-royal .subject-field { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; color: #0f172a; margin-bottom: 25px; }
        .theme-royal .subject-field span { font-family: 'Cormorant Garamond', serif; color: #1e293b; font-weight: 700; }
        .theme-royal .title-container { position: relative; padding: 25px 30px; margin: 15px auto; max-width: 90%; background: #ffffff; border-top: 1px dashed #b45309; border-bottom: 1px dashed #b45309; }
        .theme-royal .title-label { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: #b45309; margin-bottom: 10px; display: block; }
        .theme-royal .title-field { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; line-height: 1.35; color: #1e293b; }
        .theme-royal .meta-container { display: flex; justify-content: space-between; width: 100%; margin-bottom: 30px; gap: 30px; padding: 0 20px; }
        .theme-royal .meta-box { width: 48%; background: #ffffff; border: 1px solid #e2e8f0; border-bottom: 3px solid #1e293b; padding: 22px 24px; border-radius: 4px; }
        .theme-royal .meta-box h3 { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700; color: #b45309; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .theme-royal .meta-box p { font-size: 20px; color: #0f172a; margin-bottom: 6px; }
        .theme-royal .info-row { display: flex; margin-bottom: 6px; font-size: 18px; }
        .theme-royal .info-label { width: 95px; font-weight: 600; color: #475569; }
        .theme-royal .info-val { flex: 1; font-weight: 600; color: #1e293b; }
        .theme-royal .submission-date { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600; color: #475569; letter-spacing: 1px; text-align: center; margin-bottom: 15px; }

        .theme-modern { font-family: 'Montserrat', sans-serif; padding: 70px 80px 60px 100px; }
        .theme-modern::before { content: ''; position: absolute; top: 0; left: 0; width: 18px; height: 100%; background: #0f172a; }
        .theme-modern::after { content: ''; position: absolute; top: 0; left: 18px; width: 6px; height: 100%; background: #0d9488; }
        .theme-modern .college-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #0f172a; padding-bottom: 25px; }
        .theme-modern .header-text { flex: 1; }
        .theme-modern .institution-name { font-family: 'Merriweather', serif; font-size: 32px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 6px; }
        .theme-modern .department-name { font-size: 16px; font-weight: 600; color: #0d9488; text-transform: uppercase; letter-spacing: 1.5px; }
        .theme-modern .logo-placeholder { width: 100px; height: 100px; object-fit: contain; margin-left: 20px; }
        .theme-modern .assignment-info { margin-top: 40px; margin-bottom: auto; }
        .theme-modern .assignment-badge { display: inline-block; background: #f1f5f9; color: #0f172a; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; padding: 6px 14px; border-left: 3px solid #0d9488; margin-bottom: 25px; }
        .theme-modern .subject-field { font-size: 22px; font-weight: 600; color: #1e293b; margin-bottom: 20px; }
        .theme-modern .title-container { margin-top: 15px; }
        .theme-modern .title-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; margin-bottom: 8px; display: block; }
        .theme-modern .title-field { font-family: 'Merriweather', serif; font-size: 26px; font-weight: 700; line-height: 1.4; color: #0f172a; background: #f8fafc; padding: 20px; border-left: 4px solid #0f172a; }
        .theme-modern .meta-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .theme-modern .meta-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 24px; }
        .theme-modern .meta-box h3 { font-size: 16px; font-weight: 700; color: #0d9488; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .theme-modern .meta-box p { font-size: 18px; color: #1e293b; margin-bottom: 8px; line-height: 1.4; }
        .theme-modern .info-row { display: flex; margin-bottom: 6px; font-size: 16px; }
        .theme-modern .info-label { width: 85px; font-weight: 600; color: #64748b; }
        .theme-modern .info-val { flex: 1; font-weight: 500; color: #1e293b; font-size: 16px; }
        .theme-modern .submission-date { font-size: 15px; font-weight: 600; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 15px; display: flex; justify-content: space-between; }

        /* Full Responsive Design */
        @media screen and (max-width: 768px) {
            .zoom-controls {
                display: none !important;
            }
        }

        @media screen and (max-width: 1024px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .form-container {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--panel-border);
                box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            }
            .preview-wrapper {
                height: 85vh;
            }
        }

        /* Export mode overrides */
        body.exporting .form-container,
        body.exporting .zoom-controls {
            display: none !important;
        }
        body.exporting .preview-wrapper,
        body.exporting .preview-container {
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
            background: white !important;
            height: auto !important;
            overflow: visible !important;
        }
        body.exporting .page-scaler {
            transform: none !important;
            margin: 0 !important;
        }
        body.exporting .a4-page {
            transform: none !important;
            margin: 0 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-title">
            <h2>Cover Generator</h2>
        </div>
        
        <div class="section-label">Select Theme</div>
        <div class="theme-buttons">
            <button type="button" class="btn-theme active" onclick="switchTheme('classic', this)">Classic</button>
            <button type="button" class="btn-theme" onclick="switchTheme('standard', this)">Standard</button>
            <button type="button" class="btn-theme" onclick="switchTheme('royal', this)">Royal</button>
            <button type="button" class="btn-theme" onclick="switchTheme('modern', this)">Modern</button>
        </div>

        <div class="section-label">General Details</div>
        <div class="form-group">
            <label for="inputDept">Department Name</label>
            <input type="text" id="inputDept" value="Department of Marketing" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputSubject">Subject Name</label>
            <input type="text" id="inputSubject" value="" placeholder="e.g. Marketing Management" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputTitle">Assignment Title</label>
            <input type="text" id="inputTitle" value="" placeholder="e.g. Digital Marketing Strategies" oninput="updatePreview()">
        </div>

        <div class="section-label">Student Details</div>
        <div class="form-group">
            <label for="inputName">Student Name</label>
            <input type="text" id="inputName" value="..." oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputRoll">Roll No</label>
            <input type="number" id="inputRoll" placeholder="223..." value="" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputSession">Session / Section</label>
            <input type="text" id="inputSession" value="2025-26" oninput="updatePreview()">
        </div>

        <div class="section-label">Teacher Details</div>
        <div class="form-group">
            <label for="inputTeacher">Teacher Name</label>
            <input type="text" id="inputTeacher" value="..." oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputDesignation">Designation</label>
            <input type="text" id="inputDesignation" value="Lecturer" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputTeacherDept">Teacher's Dept/Inst.</label>
            <input type="text" id="inputTeacherDept" value="Dept. of Marketing, RC" oninput="updatePreview()">
        </div>

        <div class="section-label">Submission</div>
        <div class="form-group">
            <label for="inputDate">Submission Date</label>
            <input type="date" id="inputDate" onchange="updatePreview()">
        </div>

        <button class="btn-download" onclick="generatePDF()">
            <span>Download A4 PDF</span>
        </button>
        <p class="footer-credit">[Created by <a href="https://wa.me/8801774994794">Raffsun Zany</a>]</p>
    </div>

    <div class="preview-wrapper">
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
            <span class="zoom-level" id="zoomLevelText">65%</span>
            <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">-</button>
            <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom" style="width: auto; padding: 0 10px; border-radius: 15px; font-size: 0.75rem;">Reset</button>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="page-scaler" id="pageScaler">
                <!-- Cover page injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        let currentTheme = 'classic';
        let currentZoom = 0.65;
        const MIN_ZOOM = 0.2;
        const MAX_ZOOM = 1.5;
        const ZOOM_STEP = 0.05;

        function applyZoom() {
            const scaler = document.getElementById('pageScaler');
            const zoomText = document.getElementById('zoomLevelText');
            
            scaler.style.transform = `scale(${currentZoom})`;
            if (zoomText) zoomText.innerText = `${Math.round(currentZoom * 100)}%`;
            scaler.style.marginBottom = `${-(1123 * (1 - currentZoom))}px`;
        }

        function zoomIn() {
            if (window.innerWidth <= 768) return;
            if (currentZoom < MAX_ZOOM) {
                currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
                applyZoom();
            }
        }

        function zoomOut() {
            if (window.innerWidth <= 768) return;
            if (currentZoom > MIN_ZOOM) {
                currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
                applyZoom();
            }
        }

        function resetZoom() {
            autoFitZoom();
        }

        function autoFitZoom() {
            if (window.innerWidth <= 768) {
                currentZoom = 0.4;
            } else {
                const container = document.getElementById('previewContainer');
                if (container) {
                    const availableHeight = container.clientHeight - 100;
                    let autoScale = availableHeight / 1123;
                    autoScale = Math.min(Math.max(autoScale, MIN_ZOOM), 0.85);
                    currentZoom = parseFloat(autoScale.toFixed(2));
                }
            }
            applyZoom();
        }

        function formatDate(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            const options = { day: "numeric", month: "long", year: "numeric" };
            return date.toLocaleDateString("en-GB", options);
        }

        function updatePreview() {
            const viewDept = document.getElementById('viewDept');
            if(viewDept) viewDept.innerText = document.getElementById('inputDept').value;
            
            const subjectValue = document.getElementById('inputSubject').value.trim();
            const subjectWrapper = document.getElementById('subjectWrapper');
            if (subjectWrapper) {
                if (subjectValue) {
                    subjectWrapper.style.display = 'block';
                    document.getElementById('viewSubject').innerText = subjectValue;
                } else {
                    subjectWrapper.style.display = 'none';
                }
            }

            const titleValue = document.getElementById('inputTitle').value.trim();
            const titleWrapper = document.getElementById('titleWrapper');
            if (titleWrapper) {
                if (titleValue) {
                    titleWrapper.style.display = 'block';
                    document.getElementById('viewTitle').innerText = titleValue;
                } else {
                    titleWrapper.style.display = 'none';
                }
            }

            const viewName = document.getElementById('viewName');
            if(viewName) viewName.innerText = document.getElementById('inputName').value;

            const viewRoll = document.getElementById('viewRoll');
            if(viewRoll) viewRoll.innerText = document.getElementById('inputRoll').value;

            const viewSession = document.getElementById('viewSession');
            if(viewSession) viewSession.innerText = document.getElementById('inputSession').value;

            const viewTeacher = document.getElementById('viewTeacher');
            if(viewTeacher) viewTeacher.innerText = document.getElementById('inputTeacher').value;

            const viewDesignation = document.getElementById('viewDesignation');
            if(viewDesignation) viewDesignation.innerText = document.getElementById('inputDesignation').value;

            const viewTeacherDept = document.getElementById('viewTeacherDept');
            if(viewTeacherDept) viewTeacherDept.innerText = document.getElementById('inputTeacherDept').value;

            const viewDate = document.getElementById('viewDate');
            if(viewDate) viewDate.innerText = formatDate(document.getElementById('inputDate').value);
        }

        function generatePDF() {
            document.body.classList.add('exporting');
            
            const element = document.getElementById('coverPage');
            const rollNumber = document.getElementById('inputRoll').value || 'CoverPage';
            
            setTimeout(() => {
                const opt = {
                    margin:       0,
                    filename:     'Cover_Page_' + rollNumber + '.pdf',
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        scrollX: 0, 
                        scrollY: 0
                    },
                    jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    document.body.classList.remove('exporting');
                });
            }, 100);
        }

        document.getElementById('previewContainer').addEventListener('wheel', function(e) {
            if (window.innerWidth <= 768) return;
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }
        }, { passive: false });

        window.onload = function() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');

            document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
            switchTheme('classic');
            autoFitZoom();
        };

        window.onresize = function() {
            autoFitZoom();
        };

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && e.key === 'u')
            ) {
                e.preventDefault();
            }
        });
